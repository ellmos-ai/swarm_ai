[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ellmos-swarm-ai"
version = "0.1.3"
description = "Local-first Python toolkit for parallel LLM and Claude agent orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "ellmos-ai"}
]
keywords = [
  "llm",
  "multi-agent",
  "claude",
  "stigmergy",
  "consensus",
  "agent-orchestration",
  "python"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = [
  "anthropic>=0.40.0"
]

[project.optional-dependencies]
providers = ["coma @ git+https://github.com/dev-bricks/coma.git"]

[project.urls]
Homepage = "https://github.com/ellmos-ai/swarm_ai"
Documentation = "https://github.com/ellmos-ai/swarm_ai#readme"
Repository = "https://github.com/ellmos-ai/swarm_ai"
"Bug Tracker" = "https://github.com/ellmos-ai/swarm_ai/issues"
Changelog = "https://github.com/ellmos-ai/swarm_ai/blob/master/CHANGELOG.md"
Security = "https://github.com/ellmos-ai/swarm_ai/blob/master/SECURITY.md"
"Parent Organization" = "https://github.com/ellmos-ai"
"Umbrella Ecosystem" = "https://github.com/open-bricks"
"Third-Party Licenses" = "https://github.com/ellmos-ai/swarm_ai/blob/master/THIRD_PARTY_LICENSES.md"
"Marketing Log" = "https://github.com/ellmos-ai/swarm_ai/blob/master/MARKETING-LOG.txt"
"LLM Ready" = "https://github.com/ellmos-ai/swarm_ai/blob/master/llms.txt"

[project.scripts]
swarm-consensus = "tools.consensus_swarm:main"
swarm-benchmark = "tools.benchmark:main"
swarm-translate = "tools.translate_swarm:main"
swarm-summarize = "tools.summarize_chunks:main"
swarm-stigmergy-init = "tools.stigmergy_init:main"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
tools = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra -v"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B", "SIM", "C4", "RUF"]

